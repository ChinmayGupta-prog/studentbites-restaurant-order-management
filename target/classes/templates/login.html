<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: cartDrawer}"></aside>
<nav th:replace="~{fragments/layout :: mobileBottomNav}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="page-shell auth-shell">
    <section class="auth-card reveal">
        <span class="eyebrow">Student access</span>
        <h1>Login to StudentBites</h1>
        <p>Use your student account to keep your cart, checkout details and food tracking together.</p>
        <form th:action="@{/login}" th:object="${loginForm}" method="post" class="form-grid">
            <div class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
            <input th:field="*{email}" type="email" placeholder="Email" autocomplete="email" required>
            <div class="password-field">
                <input th:field="*{password}" type="password" placeholder="Password" autocomplete="current-password" required data-password-input>
                <button type="button" data-password-toggle aria-label="Show password">
                    <span class="material-symbols-rounded">visibility</span>
                </button>
            </div>
            <button class="btn primary full" type="submit">
                <span class="material-symbols-rounded">login</span>
                Login
            </button>
        </form>
        <a class="auth-link" th:href="@{/signup}">Create a new student account</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
